[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carracing-rl-course"
version = "0.1.0"
description = "DQN variants for the discrete CarRacing-v2 reinforcement learning course project."
requires-python = ">=3.10"
dependencies = [
    "swig==4.*",
    "gymnasium[box2d]==0.29.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "torch==2.5.1",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
